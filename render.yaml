services:
  - type: web
    name: youtube-mp3-backend
    runtime: python
    plan: free

    buildCommand: |
      apt-get update &&
      apt-get install -y ffmpeg &&
      pip install -r requirements.txt

    startCommand: |
      uvicorn main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /health

    envVars:
      - key: PYTHON_VERSION
        value: 3.11
